
name: Lab 13 - End-to-End MLOps

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Kolkata"

jobs:
  mlops-monitoring:
    runs-on: [self-hosted, Windows, X64]

    env:
      PYTHON_EXE: 'C:\Users\tejas\Downloads\churn-prediction-reconstructed\.venv\Scripts\python.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        shell: powershell
        run: |
          & $env:PYTHON_EXE --version
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Install API dependencies
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE"
          & $env:PYTHON_EXE -m pip install -r requirements-api.txt
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Run MLOps monitoring trigger
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE"
          Write-Host "Project directory:"
          Get-Location

          & $env:PYTHON_EXE ".\src\mlops_pipeline\12_monitor_trigger.py"

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Show monitoring result
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE"

          if (Test-Path ".\outputs\monitoring\monitor_trigger_report.json") {
              Get-Content ".\outputs\monitoring\monitor_trigger_report.json"
          } else {
              Write-Host "Monitoring report was not generated."
              exit 1
          }

      - name: Verify Kubernetes
        shell: powershell
        run: |
          kubectl get deployment churn-api
          kubectl get pods
